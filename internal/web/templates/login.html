<!DOCTYPE html>
<html lang="en">
{{template "page-head" "Sign in — 9elf26 Jira Stats"}}
<body class="grid min-h-screen place-items-center px-3 py-10 sm:px-6">
  <main data-testid="login" class="card w-full max-w-sm">
    <header>
      {{template "app-brand"}}
      <h1 class="mt-4 text-3xl font-semibold tracking-tight">Sign in</h1>
    </header>
    <section class="grid gap-4">
      {{if .Error}}
      <div data-testid="login-error" role="alert" class="alert border-rose-200 bg-rose-50" data-variant="destructive">{{.Error}}</div>
      {{end}}
      <form method="post" action="/login" class="grid gap-4">
        <input type="hidden" name="next" value="{{.Next}}">
        <label class="grid gap-1.5 text-sm font-medium">
          Email
          <input class="input w-full" type="email" name="email" autocomplete="username" required autofocus>
        </label>
        <label class="grid gap-1.5 text-sm font-medium">
          Password
          <input class="input w-full" type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn mt-1">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
