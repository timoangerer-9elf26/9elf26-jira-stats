<!DOCTYPE html>
<html lang="en">
{{template "page-head" "Sign in — 9elf26 Jira Stats"}}
<body class="min-h-screen bg-slate-50 text-slate-900 flex items-center justify-center px-6 py-12">
  <main data-testid="login" style="width:100%;max-width:22rem;">
    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:0.75rem;box-shadow:0 1px 2px rgba(0,0,0,0.05);padding:2rem;">
      <h1 class="text-2xl font-semibold tracking-tight text-center">9elf26 Jira Stats</h1>
      <p class="mt-1 text-sm text-slate-500 text-center">Sign in to continue</p>

      {{if .Error}}
      <div data-testid="login-error" role="alert"
           style="margin-top:1rem;border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;border-radius:0.375rem;padding:0.5rem 0.75rem;font-size:0.875rem;">{{.Error}}</div>
      {{end}}

      <form method="post" action="/auth/start" style="margin-top:1.25rem;display:flex;flex-direction:column;gap:0.875rem;">
        <input type="hidden" name="next" value="{{.Next}}">
        <button type="submit"
                style="margin-top:0.25rem;background:#0f172a;color:#f8fafc;border-radius:0.375rem;padding:0.5rem 1rem;font-size:0.875rem;font-weight:600;cursor:pointer;border:none;">Sign in with Atlassian</button>
      </form>
    </div>
  </main>
</body>
</html>
